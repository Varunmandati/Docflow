services:
  postgres:
    image: postgres:16-alpine
    container_name: docflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"  # CRITICAL: bind to localhost only, never 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow_admin -d docflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docflow-network

  redis:
    image: redis:7-alpine
    container_name: docflow-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - docflow-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docflow-conversion-api
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    volumes:
      - ./storage:/app/storage
    networks:
      - docflow-network
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_WORKER=${DATABASE_URL_WORKER}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docflow-conversion-worker
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "dist/index.worker.js"]
    volumes:
      - ./storage:/app/storage
    networks:
      - docflow-network
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL_WORKER=${DATABASE_URL_WORKER}

volumes:
  redis_data:
  postgres_data:

networks:
  docflow-network:
    driver: bridge

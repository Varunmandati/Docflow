services:
  - type: web
    name: docflow-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: 1
      - key: HEAVY_JOB_CONCURRENCY
        value: 1
      - key: MAX_UPLOAD_BYTES
        value: 15728640
      - key: PDF_DOCX_MAX_PAGES
        value: 30
      - key: PDF_DOCX_MAX_BYTES
        value: 10485760
      - key: PDF_DOCX_TIMEOUT_MS
        value: 180000
      - key: PDF_DOCX_OCR
        value: "off"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=192"
      - key: LOCAL_REDIS
        value: "true"
      - key: REDIS_URL
        value: "redis://127.0.0.1:6379"
      - key: RUN_INLINE_WORKERS
        value: "true"
      - key: EMAIL_TRANSPORT
        value: "resend"
      - key: RATE_LIMIT_EXPENSIVE_FALLBACK
        value: "memory"
      - key: TRUST_PROXY
        value: "true"
      - key: STREAMTOR_ENABLED
        value: "false"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: ARTIFACT_TTL_MINUTES
        value: 15
      # Secret Environment Variables (Configured in Render Dashboard)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: DATABASE_URL_WORKER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Firebase Private Key (Alternative if not using FIREBASE_SERVICE_ACCOUNT JSON).
      # NOTE: In the Render Dashboard, private keys contain newlines. Either paste multiline PEM
      # string directly into the value field or wrap single-line escaped \n in quotes.
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
